name: Cron Sync Request

on:
  schedule:
    - cron: "0 * * * *"   # co godzinę (endpoint i tak limituje do 1x/h)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Send POST request cron
        run: |
          curl -X POST --max-time 10 --connect-timeout 5 "https://develogic.dfirma.pl/wp-json/develogic/v1/sync?secret_key=1234" || true
